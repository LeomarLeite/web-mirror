# WebMirror — ambiente local com Docker.
# Uso: docker compose up --build -d   →   http://localhost:${WEBMIRROR_HOST_PORT} (padrão 18780)
# Os valores vêm do arquivo .env (modelo em .env.example). Os .zip gerados aparecem em ./downloads.
name: webmirror

services:
  webmirror:
    build: .
    image: webmirror-app:latest
    container_name: webmirror-app
    init: true
    restart: unless-stopped
    ports:
      # Só no próprio computador por padrão (a ferramenta acessa URLs arbitrárias; não expor na rede).
      - "${WEBMIRROR_BIND:-127.0.0.1}:${WEBMIRROR_HOST_PORT:-18780}:3000"
    environment:
      PORT: 3000
      DOWNLOAD_DIR: /app/downloads
      MAX_ZIP_SIZE_MB: ${MAX_ZIP_SIZE_MB:-50}
      MAX_ASSET_SIZE_MB: ${MAX_ASSET_SIZE_MB:-5}
      MAX_ASSETS: ${MAX_ASSETS:-1500}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-20}
      NAVIGATION_TIMEOUT_MS: ${NAVIGATION_TIMEOUT_MS:-45000}
      NETWORK_IDLE_TIMEOUT_MS: ${NETWORK_IDLE_TIMEOUT_MS:-15000}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-180000}
      ZIP_RETENTION_HOURS: ${ZIP_RETENTION_HOURS:-24}
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-false}
      EMBED_HOSTS: ${EMBED_HOSTS:-}
      # Modo interativo precisa de tela; o container não tem. Desligado aqui (use npm start na máquina).
      INTERACTIVE_ENABLED: ${INTERACTIVE_ENABLED:-false}
    volumes:
      - ./downloads:/app/downloads
    # O Chromium usa memória compartilhada; o padrão do Docker (64 MB) derruba abas grandes.
    shm_size: "1gb"
